<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Birthday Song MV</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Press+Start+2P&display=swap">
<style>
/* Layout: one 16:9 stage centred like a game window, transport bar underneath. Single dark look by choice. */
:root{
  color-scheme:dark;
  --night:#0b0d2a; --night-2:#171a4a; --ink:#f4f4f4; --muted:#a9a6d6;
  --xp:#7efc20; --gold:#ffd83d; --line:#2c2f72;
  --display:"Press Start 2P","Courier New",monospace;
  --body:"Pixelify Sans","Trebuchet MS",system-ui,sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--body);font-size:17px;padding-inline:16px;padding-block:18px;box-sizing:border-box;display:flex;align-items:center;justify-content:center}
.wrap{width:100%;max-width:min(1280px,calc((100dvh - 150px) * 16 / 9));min-width:0;display:flex;flex-direction:column;gap:12px}
.stage{position:relative;aspect-ratio:16/9;max-width:100%;overflow:hidden;background:var(--night-2);box-shadow:0 0 0 4px #111,0 0 0 6px var(--line)}
canvas{display:block;width:100%;height:100%}
.cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,2.2vw,22px);background:rgba(11,13,42,.84);text-align:center;padding:16px}
.cover h1{font-family:var(--display);font-weight:400;font-size:clamp(15px,3.6vw,44px);margin:0;line-height:1.4;color:var(--gold);text-shadow:.08em .08em 0 #7a5200;text-wrap:balance}
.cover p{margin:0;color:var(--muted);font-size:clamp(13px,1.7vw,19px)}
.cover form{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
input[type=text]{font:500 17px var(--body);color:var(--ink);background:#111;border:2px solid #777;padding:9px 14px;width:13em;max-width:100%}
button{font:700 17px var(--body);cursor:pointer;border:0}
.go{background:var(--xp);color:#10250a;padding:10px 26px;box-shadow:inset -3px -3px 0 rgba(0,0,0,.25),inset 3px 3px 0 rgba(255,255,255,.35)}
.bar{display:flex;align-items:center;gap:12px}
.bar button{background:#6d6d6d;color:var(--ink);padding:8px 16px;min-width:5.2em;box-shadow:inset -3px -3px 0 rgba(0,0,0,.3),inset 3px 3px 0 rgba(255,255,255,.25)}
.bar .ghost{font-weight:500;min-width:0;background:var(--night-2)}
.bar input[type=range]{flex:1;min-width:0;accent-color:var(--xp)}
.bar output{font-variant-numeric:tabular-nums;color:var(--muted);font-size:15px;white-space:nowrap}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (max-width:520px){.bar{flex-wrap:wrap}.bar input[type=range]{order:3;flex-basis:100%}}
/* ---------- transitions: every action eases instead of snapping ---------- */
:root{--ease:cubic-bezier(.22,.8,.24,1)}
.stage canvas{transition:filter .5s var(--ease)}
.stage.paused canvas{filter:brightness(.68) saturate(.8)}
.cover{backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:opacity .55s var(--ease),backdrop-filter .55s var(--ease),-webkit-backdrop-filter .55s var(--ease),visibility 0s linear 0s}
.cover.hide{opacity:0;visibility:hidden;pointer-events:none;backdrop-filter:blur(0);-webkit-backdrop-filter:blur(0);transition:opacity .6s var(--ease),backdrop-filter .6s var(--ease),-webkit-backdrop-filter .6s var(--ease),visibility 0s linear .6s}
.cover:not(.hide)>*{animation:rise .7s var(--ease) both;animation-delay:calc(var(--i,0) * .09s)}
.cover>:nth-child(1){--i:0}.cover>:nth-child(2){--i:1}.cover>:nth-child(3){--i:2}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
button{transition:transform .18s var(--ease),filter .25s ease,background-color .3s ease,opacity .15s ease}
button:hover{filter:brightness(1.14);transform:translateY(-2px)}
button:active{filter:brightness(.92);transform:translateY(1px) scale(.96);transition-duration:.06s}
button.swap{opacity:.15;transform:scale(.9)}
input[type=text]{transition:border-color .3s ease,box-shadow .3s ease,background-color .3s ease}
input[type=text]:hover{border-color:#aaa}
input[type=text]:focus{outline:none;border-color:var(--xp);box-shadow:0 0 0 4px rgba(126,252,32,.22)}
.bar input[type=range]{transition:filter .25s ease,transform .25s var(--ease)}
.bar input[type=range]:hover{filter:brightness(1.25)}
.bar input[type=range]:active{transform:scaleY(1.25)}
.bar output{transition:color .3s ease}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important;transition-delay:0s!important}}
</style>

<div class="wrap">
  <div class="stage paused" id="stage">
    <canvas id="cv" width="1920" height="1080" aria-label="Blocky animated music video for the Happy Birthday song"></canvas>
    <div class="cover" id="cover">
      <h1>HAPPY BIRTHDAY</h1>
      <p>A blocky 48-second music video for a 20th birthday. Turn the sound on.</p>
      <form id="startForm">
        <input type="text" id="who" maxlength="14" placeholder="Player name?" autocomplete="off" aria-label="Name to sing">
        <button class="go" type="submit" id="go">Play</button>
      </form>
    </div>
  </div>
  <div class="bar">
    <button id="pp" type="button">Play</button>
    <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek">
    <output id="time">0:00 / 0:48</output>
    <button id="rename" class="ghost" type="button">Change name</button>
  </div>
</div>

<script>
(()=>{
'use strict';
const W=1920,H=1080,BEAT=.6,END=80,DUR=END*BEAT,AGE=20;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let S=1,NAME='friend';
const PAL=['#ff5a4e','#ffd83d','#4fe0d4','#b56bff','#ff9a3c'];
const INK='#1b1b1b',XP='#7efc20';

/* ---------- maths ---------- */
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const prog=(b,s,d)=>cl((b-s)/d);
const eoc=u=>1-Math.pow(1-u,3);
const eic=u=>u*u*u;
const eio=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
const eob=u=>{const c=1.70158;return 1+(c+1)*Math.pow(u-1,3)+c*Math.pow(u-1,2)};
const eoe=u=>u<=0?0:u>=1?1:Math.pow(2,-10*u)*Math.sin((u*10-.75)*2.0944)+1;
const rng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const rgb=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const snap=(v,g=6)=>Math.round(v/g)*g;
function kf(b,keys){
  if(b<=keys[0][0])return keys[0][1];
  for(let i=1;i<keys.length;i++)if(b<keys[i][0]){
    const [b0,v0]=keys[i-1],[b1,v1]=keys[i],u=eio((b-b0)/(b1-b0));
    return Array.isArray(v0)?v0.map((v,j)=>v+(v1[j]-v)*u):v0+(v1-v0)*u;
  }
  return keys[keys.length-1][1];
}

/* ---------- song ---------- */
const SYL=[['Hap',0],['py',1],['birth',0],['day',1],['to',1],['you',1]];
function verse(p){
  const mk=(off,notes,durs,syl)=>({syl:syl.map((s,i)=>({text:s[0],we:s[1],b:p+off[i],d:durs[i],n:notes[i]}))});
  const o=[0,.75,1,2,3,4],d=[.75,.25,1,1,1,2];
  return [
    mk(o,['G4','G4','A4','G4','C5','B4'],d,SYL),
    mk(o.map(x=>x+6),['G4','G4','A4','G4','D5','C5'],d,SYL),
    mk([12,12.75,13,14,15,16,17],['G4','G4','G5','E5','C5','B4','A4'],[.75,.25,1,1,1,1,2],
       [['Hap',0],['py',1],['birth',0],['day',1],['dear',1],['@',0],['',1]]),
    mk([19,19.75,20,21,22,23],['F5','F5','E5','C5','D5','C5'],[.75,.25,1,1,1,3],SYL)
  ];
}
const lines=[...verse(11),...verse(42)];
lines.forEach((L,i)=>{L.start=L.syl[0].b;const last=L.syl[L.syl.length-1];L.end=lines[i+1]&&lines[i+1].syl[0].b-last.b<=last.d+.01?lines[i+1].syl[0].b:last.b+last.d});
const XPB=lines.flatMap(L=>L.syl.map(s=>s.b)).sort((a,b)=>a-b);   // every sung note earns XP

/* ---------- world constants ---------- */
const CT=-299;                               // cake top (world y)
const CX=[-112,-82,-30,30,82,112];           // candles: two plain, "2", "0", two plain
const CTYPE=['p','p','2','0','p','p'];
const UP=[23,23.75,24,25,26,27];             // candles pop up
const LB=[30,30.75,31,32,33,34];             // candles lit
const OB=[61,61.75,62,63,64,65];             // candles blown out
const LY=936;                                // lyric baseline (screen)
const TILE=80;
const CAM=[[0,[0,-260,1]],[22.5,[0,-260,1]],[26,[0,-360,1.3]],[35,[0,-370,1.34]],[40,[0,-260,1]],[54,[0,-260,1]],[57.5,[0,-365,1.36]],[64.6,[0,-375,1.4]],[67,[0,-330,.86]],[80,[0,-345,.82]]];
const N1=[10,12,40],N2=[28,32,86],D1=[60,60,130],D2=[255,160,110],W1=[70,90,170],W2=[255,190,140],P1=[100,160,255],P2=[190,225,255],C1=[8,10,36],C2=[30,26,80];
const SKY_T=[[0,N1],[10,N1],[16,D1],[29,D1],[35,W1],[37,W1],[41,P1],[53.5,P1],[57,N1],[64.5,N1],[67,C1],[80,C1]];
const SKY_B=[[0,N2],[10,N2],[16,D2],[29,D2],[35,W2],[37,W2],[41,P2],[53.5,P2],[57,N2],[64.5,N2],[67,C2],[80,C2]];
const SUN=[[0,1100],[11,1000],[16,660],[29,620],[35,560],[40,170],[53.5,170],[57,1100]];
const MOON=[[0,110],[11,110],[16,-200],[55,-200],[58,110],[80,110]];
const VIG=[[0,.5],[14,.25],[41,.05],[54,.05],[57,.55],[64.5,.55],[67,.3]];
const PARTY=[[37,0],[40,1],[53.5,1],[56,0]];
let cam={x:0,y:-260,z:1},nightA=1;
const w2s=(x,y)=>[960+(x-cam.x)*cam.z,540+(y-cam.y)*cam.z];
const setScreen=()=>ctx.setTransform(S,0,0,S,0,0);
const setWorld=()=>ctx.setTransform(S*cam.z,0,0,S*cam.z,S*(960-cam.x*cam.z),S*(540-cam.y*cam.z));

/* ---------- precomputed scatter ---------- */
const STARS=[];{const r=rng(7);for(let i=0;i<110;i++)STARS.push({x:snap(r()*W,8),y:snap(r()*780,8),s:4+((r()*3)|0)*3,ph:r()*6.28,b:(i%22)*.5})}
const CLOUDS=[{x:100,y:150,w:260,v:14},{x:760,y:300,w:200,v:9},{x:1400,y:230,w:300,v:12},{x:2000,y:340,w:220,v:10}];
const GR=[];{const r=rng(11);for(let k=-18;k<=18;k++){const sp=[];for(let j=0;j<12;j++)sp.push([snap(r()*68,10),40+snap(r()*380,10),r()>.5]);GR.push({k,e:[0,1,2,3].map(()=>(r()*3)|0),sp})}}
const BAL=[[-380,-540,2],[380,-560,3],[-540,-660,1],[540,-670,4],[-720,-560,0],[720,-550,2]];
const BALB=[11,11.75,12,13,14,15];
const LAY=[{w:440,h:110,y:-14,c:'#9c5a28',b:17.75},{w:350,h:95,y:-124,c:'#b0692f',b:18},{w:260,h:80,y:-219,c:'#c47a3a',b:19}];
const GIFTS=[{x:-430,y:0,type:'chest',b:48},{x:430,y:0,type:'chest',b:48.75},{x:-620,y:0,type:'pig',hat:2,b:49},{x:620,y:0,type:'creeper',hat:0,b:50},{x:-430,y:-120,type:'slime',b:51},{x:430,y:-120,type:'note',b:52}];
const FW=[{b:65.9,x:960,y:260,r:430,n:70,c:'#ffd83d',big:1,seed:1}];
{const r=rng(99);[66.7,67.3,68,68.6,69.4,70,70.8,71.5,72.2,73,73.6,74.5,75.2,76,77,77.8].forEach((bb,i)=>FW.push({b:bb,x:180+r()*1560,y:120+r()*380,r:200+r()*160,n:36+((r()*20)|0),c:PAL[i%5],seed:i*13+5}))}
const CREEP=['........','........','.XX..XX.','.XX..XX.','...XX...','..XXXX..','..XXXX..','..X..X..'];
const DIG={'2':['.XXX.','X...X','....X','...X.','..X..','.X...','XXXXX'],'0':['.XXX.','X...X','X..XX','X.X.X','XX..X','X...X','.XXX.']};

/* ---------- layout (needs fonts) ---------- */
const F=fs=>`700 ${fs}px "Pixelify Sans", "Trebuchet MS", system-ui, sans-serif`;
const PF=fs=>`${fs}px "Press Start 2P", "Courier New", monospace`;
const TF=PF(104);
let anchors=[],TITLE=[],TW=0;
function layout(){
  ctx.save();ctx.setTransform(1,0,0,1,0,0);
  lines.forEach(L=>{
    let fs=96,total=0;
    const measure=()=>{ctx.font=F(fs);total=0;L.syl.forEach((s,i)=>{s.disp=s.text==='@'?NAME:s.text;s.w=s.disp?ctx.measureText(s.disp).width:0;s.gap=(s.we&&i<L.syl.length-1)?fs*.3:0;total+=s.w+s.gap})};
    measure();if(total>1600){fs*=1600/total;measure()}
    let x=960-total/2;
    L.syl.forEach((s,i)=>{s.x=x;s.cx=x+s.w/2;x+=s.w+s.gap;
      if(s.text===''){const n=L.syl[i-1];n.cx=n.x+n.w*.28;n.re=s.b;s.cx=n.x+n.w*.76}});
    L.font=F(fs);
  });
  ctx.font=TF;const txt='HAPPY BIRTHDAY';TITLE=[];
  for(let i=0;i<txt.length;i++)TITLE.push({ch:txt[i],x:ctx.measureText(txt.slice(0,i)).width,w:ctx.measureText(txt[i]).width});
  TW=ctx.measureText(txt).width;
  ctx.restore();
  anchors=[{b:-1,p:()=>[960,-80]},{b:0,p:()=>[960,-80]},{b:4,p:()=>[960,470],arc:0,ease:eoc,hover:1},{b:9.8,p:()=>[960,470],arc:0}];
  lines.forEach((L,i)=>{
    if(i===3){
      CX.forEach((x,k)=>anchors.push({b:LB[k],p:()=>w2s(x,CT-96),hit:1}));
      anchors.push({b:35.2,p:()=>w2s(0,CT-230),hover:1},{b:40.5,p:()=>w2s(0,CT-230),arc:0});
      return;
    }
    L.syl.forEach(s=>anchors.push({b:s.b,p:()=>[s.cx,LY-92],hit:1}));
  });
  anchors.push({b:65.9,p:()=>[960,260],arc:0,ease:eic});
}
function anchorAt(b){let i=0;while(i<anchors.length-2&&anchors[i+1].b<=b)i++;return i}
function sparkPos(b){
  const i=anchorAt(b),A=anchors[i],B=anchors[i+1];
  if(b>=B.b)return B.p();
  let gap=B.b-A.b,u=cl((b-A.b)/gap);
  if(B.arc!==0&&gap>1.2){u=cl((b-(B.b-1))/1);gap=1}
  const pa=A.p(),pb=B.p(),e=B.ease?B.ease(u):u;
  const arc=B.arc===0?0:Math.min(240,60+90*gap);
  const wob=A.hover&&B.arc===0?Math.sin(b*2.2)*12*Math.sin(Math.PI*u):0;
  return [pa[0]+(pb[0]-pa[0])*e,pa[1]+(pb[1]-pa[1])*e-arc*4*u*(1-u)+wob];
}

/* ---------- drawing helpers ---------- */
const R=(c,x,y,w,h)=>{ctx.fillStyle=c;ctx.fillRect(x,y,w,h)};
function pix(map,x,y,p,col){ctx.fillStyle=col;map.forEach((row,j)=>{for(let i=0;i<row.length;i++)if(row[i]==='X')ctx.fillRect(x+i*p,y+j*p,p+.5,p+.5)})}
function circle(x,y,r){ctx.beginPath();ctx.arc(x,y,Math.max(0,r),0,6.2832)}
function drop(b,b0){
  if(b<b0-.5)return null;
  const u=cl((b-(b0-.5))/.5),tau=Math.max(0,b-b0),w=Math.exp(-4*tau)*Math.sin(11*tau);
  return {y:-(1-u*u)*720,sx:1+.08*w,sy:1-.11*w};
}
const flameAmt=(i,b)=>prog(b,LB[i],.35)>0?eob(prog(b,LB[i],.35))*(1-prog(b,OB[i]+.05,.2)):0;

/* ---------- layers ---------- */
function drawSky(b,t){
  const top=kf(b,SKY_T),bot=kf(b,SKY_B);
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,rgb(top));g.addColorStop(1,rgb(bot));
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  nightA=cl(1-(top[0]*.3+top[1]*.59+top[2]*.11)/80);
  if(nightA>0)for(const s of STARS){
    const pu=prog(b,s.b,.5);if(pu<=0)continue;
    const a=nightA*(Math.sin(t*2+s.ph)>-.3?1:.45),z=s.s*eob(pu);
    R(`rgba(244,244,255,${a})`,s.x-z/2,s.y-z/2,z,z);
  }
  const my=kf(b,MOON);
  if(my>-190){R('#e9ecf5',120,my,120,120);R('#c5cbe0',140,my+20,30,30);R('#c5cbe0',190,my+70,30,20)}
  const sy=kf(b,SUN);
  if(sy<1090){R('rgba(255,240,160,.25)',1045,sy-20,170,170);R('#fff3a0',1065,sy,130,130);R('#ffe066',1085,sy+20,90,90)}
  const day=kf(b,PARTY);
  if(day>0){ctx.fillStyle=`rgba(255,255,255,${.92*day})`;
    for(const c of CLOUDS){const x=snap((c.x+t*c.v)%2600-340,4);ctx.fillRect(x,c.y,c.w,40);ctx.fillRect(x+40,c.y-32,c.w-100,32)}}
}
function drawBalloons(b,t){
  const party=kf(b,PARTY);
  BAL.forEach(([x,y,ci],i)=>{
    const u=prog(b,BALB[i]-.1,.9);if(u<=0)return;
    const s=eoe(u),rise=eic(prog(b,65+i*.15,7))*1600,pulse=party*Math.exp(-3*(b%1))*14;
    const bx=x+Math.sin(t*1.1+i*1.7)*12,by=y+Math.sin(t*1.6+i)*9-rise-pulse;
    ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(bx,by+84*s);
    if(rise<1)ctx.lineTo(x*.93,0);else ctx.lineTo(bx,by+300);
    ctx.stroke();
    ctx.save();ctx.translate(bx,by);ctx.scale(s,s);
    ctx.fillStyle=PAL[ci];ctx.fillRect(-56,-56,112,112);ctx.fillRect(-40,-72,80,144);ctx.fillRect(-72,-40,144,80);ctx.fillRect(-8,72,16,14);
    R('rgba(0,0,0,.14)',-56,36,112,20);R('rgba(0,0,0,.14)',-40,56,80,16);
    R('rgba(255,255,255,.45)',-40,-44,20,28);
    ctx.restore();
  });
}
function drawGround(b){
  const g=prog(b,8,3);if(g<=0)return;
  for(const c of GR){
    const pu=prog(g*20,Math.abs(c.k),1.4);if(pu<=0)continue;
    const x=c.k*TILE-TILE/2,yo=(1-eob(pu))*90;
    ctx.save();ctx.translate(x,yo);
    R('#8a5a34',0,0,TILE+.6,520);
    for(const s of c.sp)R(s[2]?'#6e4526':'#a06c40',s[0],s[1],10,10);
    R('#5fae3a',0,0,TILE+.6,24);R('#7ccf4c',0,0,TILE+.6,7);
    for(let j=0;j<4;j++)if(c.e[j])R('#5fae3a',j*20,24,20.5,c.e[j]*9);
    ctx.restore();
  }
  if(nightA>0)R(`rgba(8,8,40,${nightA*.5})`,-1600,-.5,3200,620);
}
function partyHat(u,ci){
  if(u<=0)return;ctx.save();ctx.scale(u,u);
  R(PAL[ci],-30,-18,60,18);R(PAL[ci],-20,-36,40,18);R(PAL[ci],-10,-54,20,18);R('#fff',-8,-68,16,14);R('rgba(255,255,255,.5)',-30,-18,60,6);
  ctx.restore();
}
function drawGifts(b){
  for(const g of GIFTS){
    const d=drop(b,g.b);if(!d)continue;
    const hu=prog(b,g.b+.1,.5)>0?eob(prog(b,g.b+.1,.5)):0;

[[69,.75,'F5'],[69.75,.25,'F5'],[70,1,'E5'],[71,1,'C5'],[72,1,'D5'],[73,4,'C5']].forEach(([b,d,n])=>{ev(b,'box',hz(n),d,.2);ev(b,'box',hz(n)*2,d,.05)});
softBar(68,'F',2);softBar(70,'C',2);softBar(72,'G',1);
['C3','G3','C4','E4','G4','C5','E5','G5','C6'].forEach((n,i)=>ev(73+i*.33,'box',hz(n),2,.1));

let ac=null,master,wet,noiseBuf;
function graph(){
  ac=new (window.AudioContext||window.webkitAudioContext)();
  const comp=ac.createDynamicsCompressor();master=ac.createGain();master.gain.value=.85;master.connect(comp);comp.connect(ac.destination);
  const len=ac.sampleRate*2.2|0,buf=ac.createBuffer(2,len,ac.sampleRate);
  for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}
  const conv=ac.createConvolver();conv.buffer=buf;wet=ac.createGain();wet.gain.value=.2;wet.connect(conv);conv.connect(master);
  noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const nd=noiseBuf.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
}
const out=n=>{n.connect(master);n.connect(wet)};
function env(t,g,a,d){const n=ac.createGain();n.gain.setValueAtTime(.0001,t);n.gain.linearRampToValueAtTime(g,t+a);n.gain.exponentialRampToValueAtTime(.0001,t+a+d);return n}
function osc(type,f,t,stop,dest){const o=ac.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);o.connect(dest);o.start(t);o.stop(stop);return o}
function noise(t,g,dc,fq,type){const s=ac.createBufferSource();s.buffer=noiseBuf;s.loop=true;const f=ac.createBiquadFilter();f.type=type||'highpass';f.frequency.value=fq;const n=env(t,g,.002,dc);s.connect(f);f.connect(n);out(n);s.start(t);s.stop(t+dc+.1)}
const V={
  box(t,f,d,g){[[1,1,1.9],[2,.3,1.2],[3,.1,.8],[5.4,.04,.4]].forEach(([m,a,dc])=>{if(f*m>16000)return;const n=env(t,g*a,.004,dc);osc('sine',f*m,t,t+dc+.1,n);out(n)})},
  lead(t,f,d,g){const dur=d*BEAT,n=ac.createGain();n.gain.setValueAtTime(.0001,t);n.gain.linearRampToValueAtTime(g,t+.02);n.gain.linearRampToValueAtTime(g*.75,t+Math.max(.04,dur-.04));n.gain.exponentialRampToValueAtTime(.0001,t+dur+.2);
    const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2400;lp.connect(n);osc('triangle',f,t,t+dur+.25,lp);
    const g2=ac.createGain();g2.gain.value=.3;g2.connect(lp);osc('square',f*1.003,t,t+dur+.25,g2);out(n)},
  bass(t,f,d,g){const n=env(t,g,.01,.55);osc('triangle',f,t,t+.7,n);osc('sine',f*2,t,t+.7,n);n.connect(master)},
  stab(t,f,d,g){const n=env(t,g,.006,.22);osc('triangle',f,t,t+.3,n);out(n)},
  pad(t,f,d,g){const dur=d*BEAT,n=ac.createGain();n.gain.setValueAtTime(.0001,t);n.gain.linearRampToValueAtTime(g,t+.3);n.gain.setValueAtTime(g,t+dur);n.gain.linearRampToValueAtTime(.0001,t+dur+.9);osc('sine',f,t,t+dur+1,n);osc('triangle',f*1.003,t,t+dur+1,n);out(n)},
  kick(t,f,d,g){const n=env(t,g,.003,.18),o=osc('sine',130,t,t+.25,n);o.frequency.exponentialRampToValueAtTime(45,t+.14);n.connect(master)},
  hat(t,f,d,g){noise(t,g,.05,7000)},
  cym(t,f,d,g){noise(t,g,1.4,5000)},
  boom(t,f,d,g){const n=env(t,g,.004,.5),o=osc('sine',95,t,t+.6,n);o.frequency.exponentialRampToValueAtTime(34,t+.4);out(n);noise(t,g*.5,.7,900,'lowpass');noise(t+.08,g*.12,.9,3500)}
};
function schedule(from,t0){for(const e of score){const te=e.b*BEAT;if(te<from-.01)continue;V[e.kind](t0+te-from,e.f,e.d,e.g)}}

/* ---------- transport ---------- */
let playing=false,offset=0,t0=0,pf0=0,dragging=false;
const $=id=>document.getElementById(id);
const pp=$('pp'),seek=$('seek'),timeEl=$('time'),cover=$('cover'),stage=$('stage');
function setCover(show){cover.classList.toggle('hide',!show);cover.setAttribute('aria-hidden',String(!show))}
function setPP(txt){                       // fade the label out, swap it, fade back in
  if((pp._want||pp.textContent)===txt)return;
  pp._want=txt;pp.classList.add('swap');clearTimeout(pp._t);
  pp._t=setTimeout(()=>{pp.textContent=txt;pp._want=null;pp.classList.remove('swap')},130);
}
function now(){if(!playing)return offset;return Math.max(offset,offset+(ac?ac.currentTime-t0:(performance.now()-pf0)/1000))}
function stopAudio(){if(ac){try{ac.close()}catch(e){}ac=null}}
function play(from){
  stopAudio();offset=from>=DUR-.05?0:from;
  try{graph();if(ac.state==='suspended')ac.resume();t0=ac.currentTime+.08;schedule(offset,t0)}catch(e){ac=null}
  pf0=performance.now();playing=true;setPP('Pause');setCover(false);
}
function pause(){offset=Math.min(now(),DUR);playing=false;stopAudio();setPP(offset>=DUR-.05?'Replay':'Play')}
const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
function frame(){
  let t=now();
  if(playing&&t>=DUR){pause();t=offset=DUR;setPP('Replay')}
  render(Math.min(t,DUR));
  stage.classList.toggle('paused',!playing&&cover.classList.contains('hide'));
  if(!dragging)seek.value=Math.round(t/DUR*1000);
  timeEl.textContent=`${fmt(t)} / ${fmt(DUR)}`;
  requestAnimationFrame(frame);
}
pp.addEventListener('click',()=>playing?pause():play(offset));
seek.addEventListener('pointerdown',()=>dragging=true);
seek.addEventListener('input',()=>{const t=seek.value/1000*DUR;if(playing)play(t);else{offset=t;setPP('Play')}setCover(false)});
seek.addEventListener('change',()=>dragging=false);
window.addEventListener('pointerup',()=>dragging=false);
$('startForm').addEventListener('submit',e=>{e.preventDefault();NAME=$('who').value.trim()||'friend';layout();play(0)});
$('rename').addEventListener('click',()=>{if(playing)pause();setCover(true);$('who').focus()});
window.addEventListener('keydown',e=>{if(e.code==='Space'&&!/INPUT|BUTTON/.test(document.activeElement.tagName)){e.preventDefault();playing?pause():play(offset)}});
window.__seek=t=>{offset=t;setCover(false)};

function resize(){const dpr=Math.min(2,window.devicePixelRatio||1),w=Math.max(320,Math.round(cv.clientWidth*dpr));cv.width=w;cv.height=Math.round(w*9/16);S=cv.width/W}
new ResizeObserver(resize).observe(cv);resize();
layout();
if(document.fonts&&document.fonts.load)Promise.all([document.fonts.load(F(96)),document.fonts.load(TF)]).then(layout).catch(()=>{});
requestAnimationFrame(frame);
})();
</script>
