<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Happy Birthday :)</title>
    <link rel="apple-touch-icon" sizes="180x180" href="https://raw.githubusercontent.com/g110351/cps/main/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="https://raw.githubusercontent.com/g110351/cps/main/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="https://raw.githubusercontent.com/g110351/cps/main/favicon/favicon-16x16.png">
    <link rel="manifest" href="https://raw.githubusercontent.com/g110351/cps/main/favicon/site.webmanifest">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Pixelify+Sans:wght@500;700&family=Press+Start+2P&display=swap');
        html, body { overflow-x: hidden; }
        body { background: #ffebd0; margin: 0; padding: 0; }
        @media (max-width: 800px) { .wrap { zoom: .5; } }
        .gift { position: absolute; bottom: 0px; width: 150px; left: 172px; z-index: 12; height: 180px; }
        .wrap { height: 300px; width: 800px; margin: 0px auto; position: relative; }
        .ribbon_right { width: 45px; height: 45px; border-radius: 100% 100% 100% 0px; box-shadow: 0px 0px 0px 10px #1495f1 inset; position: absolute; right: 30px; }
        .ribbon_left { width: 45px; height: 45px; border-radius: 100% 100% 0px 100%; box-shadow: 0px 0px 0px 10px #1aa8fc inset; position: absolute; left: 30px; }
        .gift_box_top { height: 28px; top: 45px; position: absolute; width: 150px; background: #ff7d6d; box-shadow: -75px 0px 0px #ff6259 inset; }
        .gift_ribbon_center { width: 2px; bottom: 0px; position: absolute; right: 0; left: 0; margin: 0px auto; background: #1cadfe; height: 140px; border-right: 6px solid #28C9FF; border-left: 6px solid #28C9FF; z-index: 10; }
        .gift_box_bottom { background: #ff8168; bottom: 0px; height: 102px; overflow: hidden; right: 7px; position: absolute; width: 136px; box-shadow: -70px 0px 0px #fe6d68 inset; }
        .gift_box_bottom_top { height: 5px; width: 136px; right: 7px; position: absolute; bottom: 102px; background: #dd4b4c; }
        .gift_ribbon_left { height: 55px; width: 15px; left: 15px; position: absolute; background: #28c9ff; top: 40px; z-index: 11; }
        .gift_ribbon_left:after { border-width: 9px; border-style: solid; border-color: transparent; border-bottom-color: #ff8168; z-index: 12; position: absolute; content: ""; bottom: 0px; }
        .gift_box_bottom_ribbon { position: absolute; right: -25px; height: 12px; width: 110px; transform: rotate(45deg); background: #ff4149; }
        #ribbon1 { top: -15px; } #ribbon2 { top: 20px; } #ribbon3 { top: 55px; } #ribbon4 { top: 90px; }
        .line { height: 25px; width: 100%; background: #fff; bottom: -25px; position: absolute; }
        .cake { position: absolute; bottom: 0px; width: 330px; right: 172px; height: 240px; }
        .cake_bottom { position: absolute; width: 330px; height: 5px; bottom: 0px; background: #9dc5c4; border-top: 2px solid #e6e7e9; }
        .cake_bottom2 { position: absolute; width: 320px; bottom: 7px; background: #cd7a1c; height: 22px; right: 5px; border-radius: 3px 3px 0px 0px; left: 5px; box-shadow: -160px 0px 0px #ad631c inset; }
        .cake_bottom3 { box-shadow: 0px -3px 0px #fddbea, -155px 0px 0px #5a4027 inset; height: 52px; border-top: 5px solid #ff7ebe; background: #744c28; position: absolute; width: 310px; bottom: 29px; right: 10px; border-radius: 5px 5px 0px 0px; left: 10px; }
        .cake_top1 { box-shadow: -115px 0px 0px #ff9201 inset; height: 46px; background: #ffb009; position: absolute; width: 230px; bottom: 89px; right: 50px; border-radius: 5px 5px 0px 0px; left: 50px; border-bottom: 3px solid #c14500; }
        .cake_top2 { box-shadow: -70px 0px 0px #5b3f29 inset; height: 52px; background: #744c28; position: absolute; width: 140px; bottom: 138px; border-radius: 5px 5px 0px 0px; left: 0px; right: 0px; margin: 0px auto; z-index: 140; /* Ensure cake top is above candles */ }
        .cherry { width: 15px; top: -15px; height: 15px; border-radius: 100%; background: #fff; position: absolute; box-shadow: -2px -1px 0px 6px #ff4d59 inset; z-index: 160;}
        #cherry1 { left: 20px; } #cherry2 { left: 64px; } #cherry3 { left: 108px; } #cherry4 { right: 64px; } #cherry5 { right: 20px; }
        .gift_top { transition: all 0.6s ease-in-out; width: 100%; position: absolute; top: 0px; transition-delay: 0.6s; }
        .gift_ribbon_left { transition: all 0.3s ease-in-out; transition-delay: 1s; }
        .gift_ribbon_center { transition: all 0.3s ease-in-out; transition-delay: 1s; }
        .gift_box_bottom_top { transition-delay: 1.1s; }
        .candle-container { position: absolute; top: 25px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 130; }
        .candle { position: relative; width: 30px; height: 29px; display: flex; justify-content: center; align-items: center; }
        .candle-digit { font-family: Arial, sans-serif; font-size: 34px; font-weight: 900; color: #c6c6c6; text-shadow: 1px 1px 2px rgba(0,0,0,0.2); position: relative; top: 0px; }
        .flame { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); height: 12px; width: 6px; border-radius: 100%; background: #ffd215; animation: flame 0.5s infinite linear; }
        @keyframes flame { 0% { height: 12px; background: #fdd214; } 50% { height: 14px; background: #ffc617; } 100% { height: 12px; background: #fdd214; } }
        .birthday-text { font-family: 'Pacifico', cursive; font-size: 52.0px; color: #64c8e9fc; text-align: center; margin-top: 20px; }

        /* ===== music video overlay (scoped to #mv) ===== */
        #mv { --night:#0b0d2a; --night-2:#171a4a; --ink:#f4f4f4; --muted:#a9a6d6; --xp:#7efc20; --gold:#ffd83d; --line:#2c2f72; --display:"Press Start 2P","Courier New",monospace; --body:"Pixelify Sans","Trebuchet MS",system-ui,sans-serif; --ease:cubic-bezier(.22,.8,.24,1);
              position:fixed; inset:0; z-index:2000; box-sizing:border-box; padding:18px 16px; display:flex; align-items:center; justify-content:center; background:var(--night); color:var(--ink); font-family:var(--body); font-size:17px; color-scheme:dark;
              transition:opacity .9s var(--ease), transform .9s var(--ease), visibility 0s linear 0s; }
        #mv.hide { opacity:0; visibility:hidden; pointer-events:none; transform:scale(1.04); transition:opacity .9s var(--ease), transform .9s var(--ease), visibility 0s linear .9s; }
        #mv .mvwrap { width:100%; max-width:min(1280px,calc((100dvh - 150px) * 16 / 9)); min-width:0; display:flex; flex-direction:column; gap:12px; }
        #mv .stage { position:relative; aspect-ratio:16/9; max-width:100%; overflow:hidden; background:var(--night-2); box-shadow:0 0 0 4px #111,0 0 0 6px var(--line); }
        #mv canvas { display:block; width:100%; height:100%; transition:filter .5s var(--ease); }
        #mv .stage.paused canvas { filter:brightness(.68) saturate(.8); }
        #mv .cover { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:clamp(8px,2.2vw,22px); background:rgba(11,13,42,.84); text-align:center; padding:16px;
                     backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); transition:opacity .55s var(--ease), backdrop-filter .55s var(--ease), visibility 0s linear 0s; }
        #mv .cover.hide { opacity:0; visibility:hidden; pointer-events:none; backdrop-filter:blur(0); -webkit-backdrop-filter:blur(0); transition:opacity .6s var(--ease), backdrop-filter .6s var(--ease), visibility 0s linear .6s; }
        #mv .cover:not(.hide) > * { animation:mvRise .7s var(--ease) both; animation-delay:calc(var(--i,0) * .09s); }
        #mv .cover > :nth-child(1) { --i:0 } #mv .cover > :nth-child(2) { --i:1 } #mv .cover > :nth-child(3) { --i:2 }
        @keyframes mvRise { from { opacity:0; transform:translateY(18px) scale(.97); } to { opacity:1; transform:none; } }
        #mv .cover h1 { font-family:var(--display); font-weight:400; font-size:clamp(15px,3.6vw,44px); margin:0; line-height:1.4; color:var(--gold); text-shadow:.08em .08em 0 #7a5200; text-wrap:balance; }
        #mv .cover p { margin:0; color:var(--muted); font-size:clamp(13px,1.7vw,19px); }
        #mv .cover form { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
        #mv input[type=text] { font:500 17px var(--body); color:var(--ink); background:#111; border:2px solid #777; padding:9px 14px; width:13em; max-width:100%; transition:border-color .3s ease, box-shadow .3s ease; }
        #mv input[type=text]:hover { border-color:#aaa; }
        #mv input[type=text]:focus { outline:none; border-color:var(--xp); box-shadow:0 0 0 4px rgba(126,252,32,.22); }
        #mv button { font:700 17px var(--body); cursor:pointer; border:0; transition:transform .18s var(--ease), filter .25s ease, background-color .3s ease, opacity .15s ease; }
        #mv button:hover { filter:brightness(1.14); transform:translateY(-2px); }
        #mv button:active { filter:brightness(.92); transform:translateY(1px) scale(.96); transition-duration:.06s; }
        #mv button.swap { opacity:.15; transform:scale(.9); }
        #mv .go { background:var(--xp); color:#10250a; padding:10px 26px; box-shadow:inset -3px -3px 0 rgba(0,0,0,.25),inset 3px 3px 0 rgba(255,255,255,.35); }
        #mv .bar { display:flex; align-items:center; gap:12px; }
        #mv .bar button { background:#6d6d6d; color:var(--ink); padding:8px 16px; min-width:5.2em; box-shadow:inset -3px -3px 0 rgba(0,0,0,.3),inset 3px 3px 0 rgba(255,255,255,.25); }
        #mv .bar .ghost { font-weight:500; min-width:0; background:var(--night-2); }
        #mv .bar input[type=range] { flex:1; min-width:0; accent-color:var(--xp); transition:filter .25s ease, transform .25s var(--ease); }
        #mv .bar input[type=range]:hover { filter:brightness(1.25); }
        #mv .bar input[type=range]:active { transform:scaleY(1.25); }
        #mv .bar output { font-variant-numeric:tabular-nums; color:var(--muted); font-size:15px; white-space:nowrap; }
        #mv :focus-visible { outline:2px solid var(--gold); outline-offset:2px; }
        @media (max-width:520px) { #mv .bar { flex-wrap:wrap; } #mv .bar input[type=range] { order:3; flex-basis:100%; } }

        /* ===== birthday scene reveal after the MV ===== */
        #scene { opacity:0; visibility:hidden; transition:opacity .9s ease, visibility 0s linear .9s; }
        #scene.show { opacity:1; visibility:visible; transition:opacity .9s ease, visibility 0s linear 0s; }
        @keyframes sceneDrop { from { opacity:0; transform:translateY(-36px); } to { opacity:1; transform:none; } }
        @keyframes sceneRise { from { opacity:0; transform:translateY(46px) scale(.97); } to { opacity:1; transform:none; } }
        @keyframes sceneFade { from { opacity:0; } to { opacity:1; } }
        #scene.show .birthday-text { animation:sceneDrop 1s cubic-bezier(.22,.8,.24,1) .25s both; }
        #scene.show .cake { animation:sceneRise 1.1s cubic-bezier(.22,.8,.24,1) .5s both; }
        #scene.show .gift:not(.settled) { animation:sceneRise 1.1s cubic-bezier(.22,.8,.24,1) .8s both; }
        #scene.show .line { animation:sceneFade 1s ease .3s both; }
        #scene.show #volumeButton, #scene.show #replayBtn { animation:sceneFade .8s ease 1.4s both; }
        #volumeButton img { transition:transform .2s ease, filter .3s ease; }
        #volumeButton:hover img { transform:scale(1.12); }
        #replayBtn { position:absolute; top:10px; right:10px; height:38px; padding:0 14px; border:2px solid #000; border-radius:0; background:#7a7a7a; color:#e8e8e8; font:10px "Press Start 2P","Courier New",monospace; letter-spacing:1px; text-shadow:2px 2px 0 #3b3b3b; box-shadow:inset -3px -3px 0 #4a4a4a, inset 3px 3px 0 #b4b4b4; image-rendering:pixelated; cursor:pointer; z-index:1000; transition:background-color .2s ease, color .2s ease, transform .1s ease, box-shadow .1s ease; }
        #replayBtn:hover { background:#6e86d6; color:#ffffa0; text-shadow:2px 2px 0 #3a3f6a; box-shadow:inset -3px -3px 0 #3f4f94, inset 3px 3px 0 #a9b9ff; }
        #replayBtn:active { transform:translateY(2px); box-shadow:inset 3px 3px 0 #3f4f94, inset -3px -3px 0 #8a9ae0; }
        #replayBtn:focus-visible { outline:2px solid #fff; outline-offset:2px; }
        @media (max-width: 600px) { .birthday-text { margin-top:70px; font-size:44px; } }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration:.01ms !important; animation-delay:0s !important; transition-duration:.01ms !important; transition-delay:0s !important; } }

        /* ===== gift box: tap-to-unbox + voucher reveal ===== */
        .gift { cursor:pointer; outline:none; -webkit-tap-highlight-color:transparent; }
        .gift.open .gift_ribbon_left { height: 32px; transition-delay: 0s; }
        .gift.open .gift_ribbon_center { height: 102px; transition-delay: 0s; }
        .gift.open .gift_box_bottom_top { height: 0px; opacity: 0; transition: all 0.3s ease-in-out; transition-delay: 0.2s; }
        .gift_top { transition: top .55s cubic-bezier(.3,1.6,.5,1), transform .7s ease, opacity .5s ease .5s; }
        .gift.open .gift_top { top:-150px; transform:translateX(70px) rotate(32deg); opacity:0; transition-delay:0s, 0s, .45s; }
        .gift::before { content:""; position:absolute; left:50%; bottom:60px; width:300px; height:300px; margin-left:-150px; margin-bottom:-150px; z-index:-2; border-radius:50%; pointer-events:none;
                        background:repeating-conic-gradient(from 0deg, rgba(255,224,102,.42) 0deg 9deg, rgba(255,224,102,0) 9deg 22deg);
                        -webkit-mask:radial-gradient(circle, #000 18%, transparent 68%); mask:radial-gradient(circle, #000 18%, transparent 68%);
                        opacity:0; transform:scale(.2); transition:opacity .6s ease .25s, transform .9s cubic-bezier(.2,1.2,.4,1) .25s; }
        .gift.open::before { opacity:1; transform:scale(1); animation:raySpin 14s linear infinite; }
        @keyframes raySpin { to { rotate:360deg; } }
        .gift:focus-visible .gift_box_bottom { outline:3px solid #64c8e9; outline-offset:4px; }
        #scene.show .gift.shake1 { animation:giftShake .45s ease both; }
        #scene.show .gift.shake2 { animation:giftShake2 .55s ease both; }
        @keyframes giftShake { 0%,100% { transform:none; } 20% { transform:rotate(-6deg); } 45% { transform:rotate(5deg); } 70% { transform:rotate(-3deg); } }
        @keyframes giftShake2 { 0%,100% { transform:none; } 10% { transform:translateY(-14px) rotate(-9deg) scale(1.04); } 30% { transform:translateY(-6px) rotate(8deg) scale(1.06); } 50% { transform:rotate(-7deg) scale(1.03,.97); } 70% { transform:rotate(5deg); } 85% { transform:rotate(-2deg); } }
        .voucher-peek { position:absolute; left:50%; top:100px; width:122px; margin-left:-61px; z-index:-1; border-radius:6px; overflow:hidden; box-shadow:0 6px 18px rgba(0,0,0,.25);
                        transform:rotate(0deg); transition:top .8s cubic-bezier(.2,1.4,.4,1) .35s, transform .8s ease .35s; }
        .voucher-peek img { display:block; width:100%; height:auto; }
        .gift.open .voucher-peek { top:-30px; transform:rotate(-6deg); animation:peekFloat 3s ease-in-out 1.4s infinite; }
        @keyframes peekFloat { 0%,100% { translate:0 0; } 50% { translate:0 -6px; } }
        .gift.revealing .voucher-peek { opacity:0; transition:opacity .15s; }
        .gift-hint { position:absolute; left:50%; bottom:200px; transform:translateX(-50%); white-space:nowrap; padding:8px 16px; border-radius:20px; background:#fff; color:#ff4f5a;
                     font:700 22px/1.2 system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif; box-shadow:0 4px 14px rgba(255,79,90,.25); pointer-events:none;
                     animation:hintBob 1.6s ease-in-out infinite; transition:opacity .3s ease; }
        .gift-hint::after { content:""; position:absolute; left:50%; bottom:-8px; margin-left:-8px; border:8px solid transparent; border-bottom:0; border-top-color:#fff; }
        @keyframes hintBob { 0%,100% { translate:0 0; } 50% { translate:0 -8px; } }
        .gift.open .gift-hint { opacity:0; }

        /* voucher modal */
        .vm { position:fixed; inset:0; z-index:1500; display:flex; align-items:center; justify-content:center; padding:16px; visibility:hidden; pointer-events:none; }
        .vm.show { visibility:visible; pointer-events:auto; }
        .vm-backdrop { position:absolute; inset:0; background:radial-gradient(circle at 50% 45%, rgba(40,20,60,.55), rgba(10,6,25,.88)); opacity:0; transition:opacity .45s ease; -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px); }
        .vm.show .vm-backdrop { opacity:1; }
        .vm-stage { position:relative; width:min(92vw, 760px, calc((100dvh - 170px) * 1.79)); display:flex; flex-direction:column; align-items:center; gap:18px; perspective:1200px; }
        .vm-card { position:relative; width:100%; aspect-ratio:1376/768; border-radius:14px; overflow:hidden; box-shadow:0 24px 60px rgba(0,0,0,.45), 0 0 0 3px #ffd83d; transform-origin:0 0; will-change:transform;
                   transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)); transition:box-shadow .3s ease; }
        .vm-card.landed { transform-origin:50% 50%; transition:transform .18s ease-out, box-shadow .3s ease; }
        .vm-card img { display:block; width:100%; height:100%; object-fit:cover; user-select:none; -webkit-user-drag:none; }
        .vm-shine { position:absolute; inset:0; pointer-events:none; mix-blend-mode:overlay;
                    background:linear-gradient(115deg, transparent 30%, rgba(255,255,255,.75) 45%, rgba(160,220,255,.5) 50%, rgba(255,180,240,.45) 55%, transparent 70%);
                    background-size:250% 100%; background-position:var(--sx,120%) 0; }
        .vm.show .vm-card.landed .vm-shine { animation:shineSweep 1.1s ease .1s; }
        @keyframes shineSweep { from { background-position:120% 0; } to { background-position:-30% 0; } }
        .vm-stamp { position:absolute; right:6%; bottom:10%; padding:.25em .6em; border:.16em solid #e0242f; border-radius:.3em; color:#e0242f; background:rgba(255,255,255,.82);
                    font:900 clamp(22px,6vw,54px)/1 system-ui,"PingFang TC","Noto Sans TC",sans-serif; letter-spacing:.08em; transform:rotate(-14deg) scale(3); opacity:0; pointer-events:none;
                    box-shadow:inset 0 0 0 .06em rgba(224,36,47,.35); }
        .vm-card.claimed .vm-stamp { animation:stampIn .42s cubic-bezier(.2,1.5,.45,1) forwards; }
        .vm-card.claimed-static .vm-stamp { opacity:.92; transform:rotate(-14deg) scale(1); }
        @keyframes stampIn { 0% { opacity:0; transform:rotate(-14deg) scale(3); } 70% { opacity:1; transform:rotate(-14deg) scale(.92); } 100% { opacity:.92; transform:rotate(-14deg) scale(1); } }
        .vm-card.thud { animation:cardThud .35s ease; }
        @keyframes cardThud { 0%,100% { translate:0 0; } 30% { translate:0 6px; } 60% { translate:0 -2px; } }
        .vm-actions { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; opacity:0; transform:translateY(12px); transition:opacity .35s ease, transform .45s cubic-bezier(.2,1.2,.4,1); }
        .vm.show .vm-card.landed ~ .vm-actions { opacity:1; transform:none; transition-delay:.15s; }
        .vm-btn { display:inline-flex; align-items:center; gap:8px; padding:12px 24px; border:0; border-radius:999px; cursor:pointer; text-decoration:none;
                  font:800 18px system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif; transition:transform .18s cubic-bezier(.2,1.4,.4,1), filter .2s ease, background-color .3s ease, opacity .3s ease; }
        .vm-btn:hover { transform:translateY(-2px) scale(1.03); filter:brightness(1.08); }
        .vm-btn:active { transform:scale(.95); transition-duration:.06s; }
        .vm-btn:focus-visible, .vm-close:focus-visible { outline:3px solid #fff; outline-offset:3px; }
        .vm-btn.primary { background:linear-gradient(#ffe45c,#ffc21a); color:#3a1d00; box-shadow:0 4px 0 #c98a00, 0 8px 20px rgba(255,194,26,.45); animation:ctaPulse 1.8s ease-in-out infinite; }
        @keyframes ctaPulse { 0%,100% { box-shadow:0 4px 0 #c98a00, 0 0 0 0 rgba(255,216,61,.6); } 50% { box-shadow:0 4px 0 #c98a00, 0 0 0 12px rgba(255,216,61,0); } }
        .vm-btn.primary[disabled] { animation:none; background:#3ccf6e; color:#fff; box-shadow:0 4px 0 #1f9a49; cursor:default; transform:none; filter:none; }
        .vm-btn.ghost { background:rgba(255,255,255,.14); color:#fff; box-shadow:inset 0 0 0 2px rgba(255,255,255,.5); }
        .vm-btn.ghost[hidden] { display:none; }
        .vm-close { position:absolute; top:-14px; right:-10px; width:42px; height:42px; border-radius:50%; border:0; background:#fff; color:#333; font:700 20px/42px system-ui,sans-serif; cursor:pointer;
                    box-shadow:0 4px 14px rgba(0,0,0,.3); opacity:0; transform:scale(.4) rotate(-90deg); transition:opacity .3s ease, transform .4s cubic-bezier(.2,1.4,.4,1); z-index:2; }
        .vm.show .vm-card.landed ~ .vm-close { opacity:1; transform:none; }
        .vm-close:hover { transform:rotate(90deg) scale(1.08) !important; }
        #fx { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:3000; }
    </style>
</head>
<body>
<div id="mv">
<div class="mvwrap">
  <div class="stage paused" id="stage">
    <canvas id="cv" width="1920" height="1080" aria-label="Blocky animated music video for the Happy Birthday song"></canvas>
    <div class="cover" id="cover">
      <h1>HAPPY BIRTHDAY</h1>
      <p>A blocky 48-second music video for a 20th birthday. Turn the sound on.</p>
      <form id="startForm">
        <input type="text" id="who" maxlength="14" placeholder="Player name?" value="Winter" autocomplete="off" aria-label="Name to sing">
        <button class="go" type="submit" id="go">Play</button>
      </form>
    </div>
  </div>
  <div class="bar">
    <button id="pp" type="button">Play</button>
    <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek">
    <output id="time">0:00 / 0:48</output>
    <button id="rename" class="ghost" type="button">Change name</button>
    <button id="skip" class="ghost" type="button">Skip &rsaquo;</button>
  </div>
</div>
</div>
<div id="scene">

function drawTitle(b,t){
  if(b<68.4)return;
  ctx.font=TF;ctx.textBaseline='middle';ctx.textAlign='left';ctx.lineJoin='miter';
  const sc=Math.min(1,1640/TW),x0=960-TW*sc/2;
  for(let pass=0;pass<3;pass++)TITLE.forEach((L,i)=>{
    if(L.ch===' ')return;
    const u=prog(b,68.5+i*.16,.7);if(u<=0)return;
    ctx.save();ctx.globalAlpha=cl(u*3);ctx.translate(x0+(L.x+L.w/2)*sc,snap(300-(1-eoc(u))*70+Math.sin(t*2+i*.5)*5*u,2));ctx.scale(sc*eob(u),sc*eob(u));
    if(pass===0){ctx.strokeStyle=INK;ctx.lineWidth=16;ctx.strokeText(L.ch,-L.w/2,0);ctx.strokeText(L.ch,-L.w/2+12,12)}
    else if(pass===1){ctx.fillStyle='#9a6a00';for(let k=12;k>=1;k-=2)ctx.fillText(L.ch,-L.w/2+k,k)}
    else{ctx.fillStyle='#ffd83d';ctx.fillText(L.ch,-L.w/2,0)}
    ctx.restore();
  });
  const a=eoc(prog(b,72,1.2));
  caption('dear '+NAME,960,440+(1-a)*20,F(68),a,'#ffffff');
  const sp=prog(b,73.5,.6);
  if(sp>0){ctx.save();ctx.translate(1500,455);ctx.rotate(-.3);const z=eob(sp)*(1+.06*Math.sin(t*7));ctx.scale(z,z);caption('Level '+AGE+'!',0,0,F(60),1,'#ffff55',8);ctx.restore()}
}

function render(t){
  const b=t/BEAT,c=kf(b,CAM);cam={x:c[0],y:c[1],z:c[2]};
  setScreen();ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  drawSky(b,t);
  setWorld();drawBalloons(b,t);drawGround(b);drawGifts(b);drawCake(b,t);
  setScreen();
  drawFireworks(b);drawBunting(b,t);
  const va=kf(b,VIG),vg=ctx.createRadialGradient(960,540,480,960,540,1150);vg.addColorStop(0,'rgba(8,6,30,0)');vg.addColorStop(1,`rgba(8,6,30,${va})`);ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  drawConfetti(b);
  caption((NAME==='friend'?'Player':NAME)+' joined the game',960,640,F(50),kf(b,[[1.5,0],[3,1],[8,1],[9.5,0]]),'#ffff55');
  caption('make a wish...',960,190,PF(46),kf(b,[[57.5,0],[58.5,1],[60.2,1],[61,0]]),'#ffffff');
  drawLyrics(b);drawHud(b);drawSpark(b,t);drawToast(b);drawTitle(b,t);
}

/* ---------- music ---------- */
const SEMI={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const hz=n=>440*Math.pow(2,(SEMI[n[0]]+12*(+n[1]+1)-69)/12);
const score=[];const ev=(b,kind,f,d,g)=>score.push({b,kind,f,d,g});
const CH={C:{bass:'C2',arp:['C3','G3','E4'],st:['E4','G4','C5']},G:{bass:'G2',arp:['B2','G3','D4'],st:['D4','G4','B4']},F:{bass:'F2',arp:['A2','F3','C4'],st:['F4','A4','C5']}};
const arp=(b0,notes,step=.5,g=.16)=>notes.forEach((n,i)=>ev(b0+i*step,'box',hz(n),1,g));
const softBar=(b0,c,len)=>{for(let k=0;k<len;k++)ev(b0+k,'box',hz(CH[c].arp[k%3]),1,.1)};
const fullBar=(b0,c,len)=>{ev(b0,'bass',hz(CH[c].bass),1,.28);ev(b0,'kick',0,0,.5);
  for(let k=len>1?1:0;k<len;k++){CH[c].st.forEach(n=>ev(b0+k,'stab',hz(n),.3,.06));ev(b0+k,'hat',0,0,.045)}};
arp(0,['C4','E4','G4','C5','G4','E4']);arp(3,['C4','F4','A4','C5','A4','F4']);arp(6,['C4','E4','G4','E5','G4','E4']);arp(9,['B3','D4','G4','B4']);
lines.slice(0,4).forEach(L=>L.syl.forEach(s=>{ev(s.b,'box',hz(s.n),s.d,.21);ev(s.b,'box',hz(s.n)*2,s.d,.05)}));
[[12,'C',3],[15,'G',3],[18,'G',3],[21,'C',3],[24,'C',3],[27,'F',4],[31,'C',2],[33,'G',1],[34,'C',3]].forEach(a=>softBar(...a));
CH.C.st.forEach(n=>ev(34,'pad',hz(n),3,.03));
fullBar(37,'C',3);fullBar(40,'G',3);arp(40,['G4','B4','D5','F5'],.5,.12);ev(41.5,'hat',0,0,.05);
[[43,'C',3],[46,'G',3],[49,'G',3],[52,'C',3],[62,'C',2],[64,'G',1]].forEach(a=>fullBar(...a));
[[55,'C',3],[58,'F',4]].forEach(([b0,c,len])=>{softBar(b0,c,len);CH[c].st.forEach(n=>ev(b0,'pad',hz(n),len,.035))});
lines.slice(4).forEach((L,i)=>L.syl.forEach(s=>{
  if(i===2){ev(s.b,'box',hz(s.n),s.d,.22);ev(s.b,'box',hz(s.n)*2,s.d,.05)}
  else{ev(s.b,'lead',hz(s.n),s.d,.13);ev(s.b,'box',hz(s.n)*2,s.d,.06)}}));
ev(65,'bass',hz('C2'),1,.3);ev(65,'kick',0,0,.5);ev(65,'cym',0,0,.1);['C4','E4','G4','C5'].forEach(n=>ev(65,'pad',hz(n),5,.035));
ev(65.9,'boom',0,0,.5);['C6','E6','G6','C7'].forEach((n,i)=>ev(65.9+i*.14,'box',hz(n),1,.07));
['E6','B6','E7'].forEach((n,i)=>ev(66.4+i*.12,'box',hz(n),1,.06));          // level-up chime
FW.slice(1).forEach(f=>ev(f.b,'boom',0,0,.14));
[[69,.75,'F5'],[69.75,.25,'F5'],[70,1,'E5'],[71,1,'C5'],[72,1,'D5'],[73,4,'C5']].forEach(([b,d,n])=>{ev(b,'box',hz(n),d,.2);ev(b,'box',hz(n)*2,d,.05)});
softBar(68,'F',2);softBar(70,'C',2);softBar(72,'G',1);
['C3','G3','C4','E4','G4','C5','E5','G5','C6'].forEach((n,i)=>ev(73+i*.33,'box',hz(n),2,.1));

let ac=null,master,wet,noiseBuf;
function graph(){
  ac=new (window.AudioContext||window.webkitAudioContext)();
  const comp=ac.createDynamicsCompressor();master=ac.createGain();master.gain.value=.85;master.connect(comp);comp.connect(ac.destination);
  const len=ac.sampleRate*2.2|0,buf=ac.createBuffer(2,len,ac.sampleRate);
  for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}
  const conv=ac.createConvolver();conv.buffer=buf;wet=ac.createGain();wet.gain.value=.2;wet.connect(conv);conv.connect(master);
  noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const nd=noiseBuf.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
}
const out=n=>{n.connect(master);n.connect(wet)};
function env(t,g,a,d){const n=ac.createGain();n.gain.setValueAtTime(.0001,t);n.gain.linearRampToValueAtTime(g,t+a);n.gain.exponentialRampToValueAtTime(.0001,t+a+d);return n}
function osc(type,f,t,stop,dest){const o=ac.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);o.connect(dest);o.start(t);o.stop(stop);return o}
function noise(t,g,dc,fq,type){const s=ac.createBufferSource();s.buffer=noiseBuf;s.loop=true;const f=ac.createBiquadFilter();f.type=type||'highpass';f.frequency.value=fq;const n=env(t,g,.002,dc);s.connect(f);f.connect(n);out(n);s.start(t);s.stop(t+dc+.1)}
const V={
  box(t,f,d,g){[[1,1,1.9],[2,.3,1.2],[3,.1,.8],[5.4,.04,.4]].forEach(([m,a,dc])=>{if(f*m>16000)return;const n=env(t,g*a,.004,dc);osc('sine',f*m,t,t+dc+.1,n);out(n)})},
  lead(t,f,d,g){const dur=d*BEAT,n=ac.createGain();n.gain.setValueAtTime(.0001,t);n.gain.linearRampToValueAtTime(g,t+.02);n.gain.linearRampToValueAtTime(g*.75,t+Math.max(.04,dur-.04));n.gain.exponentialRampToValueAtTime(.0001,t+dur+.2);
    const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2400;lp.connect(n);osc('triangle',f,t,t+dur+.25,lp);
    const g2=ac.createGain();g2.gain.value=.3;g2.connect(lp);osc('square',f*1.003,t,t+dur+.25,g2);out(n)},
  bass(t,f,d,g){const n=env(t,g,.01,.55);osc('triangle',f,t,t+.7,n);osc('sine',f*2,t,t+.7,n);n.connect(master)},
  stab(t,f,d,g){const n=env(t,g,.006,.22);osc('triangle',f,t,t+.3,n);out(n)},
  pad(t,f,d,g){const dur=d*BEAT,n=ac.createGain();n.gain.setValueAtTime(.0001,t);n.gain.linearRampToValueAtTime(g,t+.3);n.gain.setValueAtTime(g,t+dur);n.gain.linearRampToValueAtTime(.0001,t+dur+.9);osc('sine',f,t,t+dur+1,n);osc('triangle',f*1.003,t,t+dur+1,n);out(n)},
  kick(t,f,d,g){const n=env(t,g,.003,.18),o=osc('sine',130,t,t+.25,n);o.frequency.exponentialRampToValueAtTime(45,t+.14);n.connect(master)},
  hat(t,f,d,g){noise(t,g,.05,7000)},
  cym(t,f,d,g){noise(t,g,1.4,5000)},
  boom(t,f,d,g){const n=env(t,g,.004,.5),o=osc('sine',95,t,t+.6,n);o.frequency.exponentialRampToValueAtTime(34,t+.4);out(n);noise(t,g*.5,.7,900,'lowpass');noise(t+.08,g*.12,.9,3500)}
};
function schedule(from,t0){for(const e of score){const te=e.b*BEAT;if(te<from-.01)continue;V[e.kind](t0+te-from,e.f,e.d,e.g)}}

/* ---------- transport ---------- */
let playing=false,offset=0,t0=0,pf0=0,dragging=false;
const $=id=>document.getElementById(id);
const pp=$('pp'),seek=$('seek'),timeEl=$('time'),cover=$('cover'),stage=$('stage');
function setCover(show){cover.classList.toggle('hide',!show);cover.setAttribute('aria-hidden',String(!show))}
function setPP(txt){                       // fade the label out, swap it, fade back in
  if((pp._want||pp.textContent)===txt)return;
  pp._want=txt;pp.classList.add('swap');clearTimeout(pp._t);
  pp._t=setTimeout(()=>{pp.textContent=txt;pp._want=null;pp.classList.remove('swap')},130);
}
function now(){if(!playing)return offset;return Math.max(offset,offset+(ac?ac.currentTime-t0:(performance.now()-pf0)/1000))}
function stopAudio(){if(ac){try{ac.close()}catch(e){}ac=null}}
function play(from){
  stopAudio();offset=from>=DUR-.05?0:from;
  try{graph();if(ac.state==='suspended')ac.resume();t0=ac.currentTime+.08;schedule(offset,t0)}catch(e){ac=null}
  pf0=performance.now();playing=true;setPP('Pause');setCover(false);
}
function pause(){offset=Math.min(now(),DUR);playing=false;stopAudio();setPP(offset>=DUR-.05?'Replay':'Play')}
const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
function frame(){
  if(!active){requestAnimationFrame(frame);return}
  let t=now();
  if(playing&&t>=DUR){pause();t=offset=DUR;setPP('Replay');clearTimeout(endT);endT=setTimeout(()=>{if(active&&!playing&&offset>=DUR-.05)enterScene()},1800)}
  render(Math.min(t,DUR));
  stage.classList.toggle('paused',!playing&&cover.classList.contains('hide'));
  if(!dragging)seek.value=Math.round(t/DUR*1000);
  timeEl.textContent=`${fmt(t)} / ${fmt(DUR)}`;
  requestAnimationFrame(frame);
}
pp.addEventListener('click',()=>playing?pause():play(offset));
seek.addEventListener('pointerdown',()=>dragging=true);
seek.addEventListener('input',()=>{const t=seek.value/1000*DUR;if(playing)play(t);else{offset=t;setPP('Play')}setCover(false)});
seek.addEventListener('change',()=>dragging=false);
window.addEventListener('pointerup',()=>dragging=false);
$('startForm').addEventListener('submit',e=>{e.preventDefault();NAME=$('who').value.trim()||'Winter';layout();play(0)});
$('rename').addEventListener('click',()=>{if(playing)pause();setCover(true);$('who').focus()});
window.addEventListener('keydown',e=>{if(active&&e.code==='Space'&&!/INPUT|BUTTON/.test(document.activeElement.tagName)){e.preventDefault();playing?pause():play(offset)}});
window.__seek=t=>{offset=t;setCover(false)};


/* ---------- hand-off between the MV and the birthday scene ---------- */
const mvEl=$('mv'),sceneEl=document.getElementById('scene'),sceneTitle=document.querySelector('.birthday-text');
const ICON_ON='https://cdn-icons-png.flaticon.com/512/1968/1968844.png',ICON_OFF='https://cdn-icons-png.flaticon.com/512/1968/1968843.png';
let endT=0;
function enterScene(){
  clearTimeout(endT);NAME=$('who').value.trim()||'Winter';
  if(playing)pause();else stopAudio();
  active=false;sceneTitle.textContent='Happy Birthday '+NAME;
  mvEl.classList.add('hide');mvEl.setAttribute('aria-hidden','true');
  sceneEl.classList.add('show');
  audio.play().then(()=>{volumeIcon.src=ICON_ON}).catch(()=>{});
}
function openMV(){
  clearTimeout(endT);audio.pause();volumeIcon.src=ICON_OFF;
  sceneEl.classList.remove('show');
  playing=false;offset=0;setPP('Play');setCover(true);layout();
  mvEl.classList.remove('hide');mvEl.removeAttribute('aria-hidden');active=true;
}
$('skip').addEventListener('click',enterScene);
document.getElementById('replayBtn').addEventListener('click',openMV);

function resize(){const dpr=Math.min(2,window.devicePixelRatio||1),w=Math.max(320,Math.round(cv.clientWidth*dpr));cv.width=w;cv.height=Math.round(w*9/16);S=cv.width/W}
new ResizeObserver(resize).observe(cv);resize();
layout();
if(document.fonts&&document.fonts.load)Promise.all([document.fonts.load(F(96)),document.fonts.load(TF)]).then(layout).catch(()=>{});
requestAnimationFrame(frame);
})();
</script>
