<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>梅花易卜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=LXGW+WenKai+TC:wght@400;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.7.7/lunar.js"></script>
<style>
/* Layout: a night altar. Bagua ring and title, the casting form as a low altar, the result as one divination slip. A veil covers the screen while the hexagram is cast. One dark world by design. */
:root {
  --xuan: #0e1218;        /* 玄 night ground */
  --xuan-2: #151b23;      /* slip surface */
  --line: #2a323c;        /* hairlines */
  --jin: #c9ab6c;         /* 泥金 accent */
  --jin-dim: #7d6c47;
  --zhu: #b8402e;         /* 朱砂 seal */
  --xue: #ebe3d0;         /* 宣 paper-white text */
  --yan: #8e939a;         /* 煙 muted text */
  --title: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --kai: "LXGW WenKai TC", "Kaiti TC", "BiauKai", "DFKai-SB", "STKaiti", serif;
  color-scheme: dark;
}
html, body { background: var(--xuan); }
body { color: var(--xue); font-family: var(--kai); font-size: 17px; line-height: 1.85; }
#sky { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
.wrap { position: relative; z-index: 1; max-width: 640px; margin: 0 auto; padding-inline: 18px; padding-block: 28px 64px; display: grid; gap: 30px; }

/* ring */
.ringsvg .r1, .ringsvg .r2 { fill: none; stroke: var(--jin-dim); stroke-width: .6; }
.ringsvg .tri rect { fill: var(--jin-dim); }
.ringsvg .tri text { fill: var(--jin-dim); font-family: var(--title); font-size: 13px; }
.ringsvg svg { width: 100%; height: auto; display: block; }

.crest { position: relative; display: grid; justify-items: center; padding-block: 34px 6px; }
#ring { position: absolute; top: -18px; left: 50%; width: min(340px, 92vw); transform: translateX(-50%); opacity: .5; }
@media (prefers-reduced-motion: no-preference) {
  #ring svg .tri { animation: turn 240s linear infinite; transform-origin: 0 0; }
  @keyframes turn { to { transform: rotate(360deg); } }
}
h1 { position: relative; font-family: var(--title); font-weight: 900; font-size: clamp(44px, 12vw, 64px); letter-spacing: .32em; margin: 92px 0 0 .32em; line-height: 1.1; color: var(--xue); text-shadow: 0 0 24px rgba(201,171,108,.18); }
.motto { position: relative; margin: 10px 0 0; color: var(--jin); letter-spacing: .5em; font-size: 14px; padding-left: .5em; }

/* altar */
.altar { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px 14px; align-items: end; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding-block: 18px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label { color: var(--jin); font-family: var(--title); font-size: 15px; letter-spacing: .2em; }
input, select { width: 100%; font: inherit; font-size: 16px; color: var(--xue); background: transparent; border: 0; border-bottom: 1px solid var(--jin-dim); border-radius: 0; padding: 6px 2px; color-scheme: dark; }
select option { background: var(--xuan-2); color: var(--xue); }
#go { grid-column: 1 / -1; justify-self: center; font-family: var(--title); font-weight: 900; font-size: 20px; letter-spacing: .6em; padding: 10px 18px 10px calc(18px + .6em); color: var(--xue); background: var(--zhu); border: 0; border-radius: 3px; cursor: pointer; box-shadow: inset 0 0 0 2px rgba(235,227,208,.18), 0 6px 18px rgba(184,64,46,.25); transition: filter .3s, opacity .3s; }
#go:hover { filter: brightness(1.08); }
#go:disabled { opacity: .6; cursor: progress; }
input:focus-visible, select:focus-visible, button:focus-visible { outline: 1px solid var(--jin); outline-offset: 4px; }
.altar-foot { grid-column: 1 / -1; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 4px 12px; }
#lunar { margin: 0; color: var(--yan); font-size: 15px; letter-spacing: .12em; }
#sound { font: inherit; font-size: 13px; letter-spacing: .15em; color: var(--yan); background: none; border: 1px solid var(--line); border-radius: 2px; padding: 2px 10px; cursor: pointer; }
#sound[aria-pressed="true"] { color: var(--jin); border-color: var(--jin-dim); }

/* veil */
.veil { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; align-content: center; gap: 26px; padding-inline: 16px;
  background: radial-gradient(circle at 50% 44%, rgba(24,30,40,.96), rgba(5,7,10,.985) 70%);
  opacity: 0; visibility: hidden; transition: opacity .8s ease, visibility 0s linear .8s; cursor: pointer; }
.veil.on { opacity: 1; visibility: visible; transition: opacity .8s ease; }
.veil.on.fade { opacity: 0; }
.vstage { position: relative; width: min(380px, 80vw); }
#vring .tri rect, #vring .tri text { fill: var(--jin); }
#vring .r1, #vring .r2 { stroke: var(--jin); opacity: .6; }
#vring svg { filter: drop-shadow(0 0 14px rgba(201,171,108,.35)); }
#pillars { position: absolute; inset: 0; display: flex; flex-direction: row-reverse; justify-content: center; align-items: center; gap: 4px; }
.pillar { writing-mode: vertical-rl; font-family: var(--title); font-weight: 900; font-size: clamp(16px, 4.6vw, 21px); letter-spacing: .12em; color: var(--xue); opacity: 0; filter: blur(8px); transform: translateY(10px); transition: opacity .8s ease, filter .8s ease, transform .8s ease; padding-inline: 2px; }
.pillar.shown { opacity: 1; filter: none; transform: none; }
#whisper { margin: 0; font-size: 18px; letter-spacing: .6em; padding-left: .6em; color: var(--jin); min-height: 1.6em; text-align: center; }
.veil .hint { position: absolute; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); left: 0; right: 0; text-align: center; color: var(--yan); font-size: 12px; letter-spacing: .3em; }

/* slip */
.slip { background: var(--xuan-2); border: 1px solid var(--line); border-radius: 2px; padding-inline: clamp(16px, 5vw, 32px); padding-block: 22px 28px; display: grid; gap: 26px; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
.slip::before, .slip::after { content: ""; position: absolute; left: 10px; right: 10px; height: 1px; background: var(--jin-dim); opacity: .6; }
.slip::before { top: 8px; } .slip::after { bottom: 8px; }
.slip-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; color: var(--yan); font-size: 14px; letter-spacing: .12em; }

.rest { justify-items: center; text-align: center; color: var(--yan); padding-block: 40px; }
.rest .ghost { display: flex; flex-direction: column; gap: 9px; width: 96px; }
.rest .ghost i { height: 10px; border: 1px dashed var(--jin-dim); border-radius: 1px; opacity: .55; }
.rest p { margin: 0; letter-spacing: .3em; line-height: 2.1; }

.trio { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr) minmax(0, 1fr); gap: 10px; align-items: end; }
.gua { margin: 0; display: grid; justify-items: center; gap: 10px; opacity: 0; transition: opacity .7s ease; }
.gua.shown { opacity: 1; }
.gua figcaption { color: var(--yan); font-size: 13px; letter-spacing: .4em; padding-left: .4em; }
.yaos { display: flex; flex-direction: column-reverse; gap: 8px; width: min(76px, 80%); }
.ben .yaos { width: min(108px, 64%); gap: 10px; }
.yao { height: 9px; display: flex; gap: 16%; position: relative; }
.ben .yao { height: 12px; }
.yao i { flex: 1; background: var(--jin); border-radius: 1px 3px 2px 1px; clip-path: inset(0 100% 0 0); transition: clip-path .55s cubic-bezier(.3,.7,.2,1), background .6s, box-shadow .6s; }
.yao i + i { transition-delay: .14s; }
.yao.drawn i { clip-path: inset(0 0 0 0); }
.yl { position: absolute; left: calc(100% + 10px); top: 50%; transform: translateY(-50%); font-style: normal; font-size: 13px; color: var(--yan); white-space: nowrap; opacity: 0; transition: opacity .6s .25s; letter-spacing: .05em; }
.yao.drawn .yl { opacity: 1; }
.yao.dong.lit i { background: var(--zhu); box-shadow: 0 0 12px rgba(184,64,46,.7); }
.yao.dong.lit .yl { color: var(--zhu); }
.gname, .gno { opacity: 0; transform: translateY(6px); transition: opacity .8s ease, transform .8s ease; }
.gua.named .gname, .gua.named .gno { opacity: 1; transform: none; }
.gname { font-family: var(--title); font-weight: 600; font-size: 17px; letter-spacing: .1em; text-align: center; line-height: 1.3; }
.ben .gname { font-weight: 900; font-size: 23px; color: var(--xue); }
.gno { color: var(--yan); font-size: 13px; }

.judge { display: flex; align-items: center; justify-content: center; gap: 22px; }
.seal { width: 84px; height: 84px; background: var(--zhu); border-radius: 4px; display: grid; place-items: center; box-shadow: inset 0 0 0 3px var(--xuan-2), inset 0 0 0 5px rgba(235,227,208,.5);
  opacity: 0; transform: rotate(-5deg) scale(2.1); transition: transform .26s cubic-bezier(.55,0,.8,.2), opacity .14s; }
.seal.down { opacity: 1; transform: rotate(-5deg) scale(1); }
.seal span { writing-mode: vertical-rl; font-family: var(--title); font-weight: 900; font-size: 21px; letter-spacing: .08em; color: var(--xue); line-height: 1; }
.verdict .lv { font-family: var(--title); font-weight: 900; font-size: clamp(40px, 11vw, 54px); color: var(--jin); line-height: 1.05; letter-spacing: .1em; }
.verdict .sub { color: var(--yan); letter-spacing: .2em; }
.step { opacity: 0; transform: translateY(8px); transition: opacity .9s ease, transform .9s ease; }
.step.shown { opacity: 1; transform: none; }
.shake { animation: shake .4s ease-out; }
@keyframes shake { 20% { transform: translate(-2px, 1px); } 40% { transform: translate(2px, -1px); } 60% { transform: translate(-1px, 1px); } 80% { transform: translate(1px, 0); } }

.text { display: flex; gap: 22px; align-items: flex-start; }
.verse { margin: 0; writing-mode: vertical-rl; max-height: 15em; border-left: 1px solid var(--line); padding-left: 18px; font-size: 19px; letter-spacing: .14em; line-height: 1.9; flex: none; max-width: 46%; overflow-x: auto; }
.verse span { opacity: 0; filter: blur(4px); transition: opacity .7s ease, filter .9s ease; }
.verse.inked span { opacity: 1; filter: none; }
.verse .vt { font-family: var(--title); font-weight: 900; color: var(--jin); margin-bottom: .6em; display: inline-block; }
.reading { min-width: 0; display: grid; gap: 10px; }
.reading p { margin: 0; }
.reading .word { color: var(--jin); font-size: 19px; }
.hush { text-align: center; color: var(--yan); letter-spacing: .1em; }
footer { text-align: center; color: var(--yan); font-size: 13px; letter-spacing: .2em; }

.instant, .instant * { transition: none !important; animation: none !important; }

@media (max-width: 460px) {
  .text { flex-direction: column; }
  .verse { writing-mode: horizontal-tb; max-height: none; max-width: none; border-left: 0; border-top: 1px solid var(--line); padding: 14px 0 0; }
  .verse .vt { margin: 0 .6em 0 0; }
  .seal { width: 72px; height: 72px; } .seal span { font-size: 18px; }
  .trio { grid-template-columns: minmax(0, .9fr) minmax(0, 1.5fr) minmax(0, .9fr); gap: 6px; }
  .ben .yaos { width: 58%; }
  .yl { font-size: 11px; left: calc(100% + 6px); }
  .gname { font-size: 14px; } .ben .gname { font-size: 19px; }
}
@media (prefers-reduced-motion: reduce) {
  .yao i, .gname, .gno, .step, .verse span, .pillar, .gua, .seal { transition-duration: .2s !important; transition-delay: 0s !important; }
  .seal { transform: rotate(-5deg) scale(1); }
}

.verify { color: var(--yan); font-size: 13px; letter-spacing: .08em; }
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<main class="wrap">
  <header class="crest">
    <div id="ring" class="ringsvg"></div>
    <h1>梅花易卜</h1>
    <p class="motto">一時一卦 · 心誠則靈</p>
  </header>

  <form class="altar" id="altar">
    <div class="field"><label for="when">時</label><input id="when" type="datetime-local" min="1900-01-01T00:00" max="2100-12-31T23:59" required></div>
    <div class="field"><label for="topic">問</label>
      <select id="topic">
        <option value="綜合">總運</option><option value="事業">事業</option><option value="財運">財帛</option>
        <option value="感情">姻緣</option><option value="健康">康寧</option><option value="考試">功名</option><option value="出行">出行</option>
      </select></div>
    <button type="submit" id="go">起卦</button>
    <div class="altar-foot"><p id="lunar">　</p><button type="button" id="sound" aria-pressed="true">鐘聲　開</button></div>
  </form>

  <section id="oracle" aria-live="polite">
    <article class="slip rest">
      <div class="ghost" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <p>擇一時辰　默念所問<br>按「起卦」</p>
    </article>
  </section>

  <footer>卜辭僅供玩賞　吉凶仍在人為<br>推演由內嵌的小型神經網路（約 83 萬參數）在本機完成</footer>
</main>

<div class="veil" id="veil" aria-hidden="true">
  <div class="vstage"><div id="vring" class="ringsvg"></div><div id="pillars"></div></div>
  <p id="whisper"></p>
  <p class="hint">輕觸略過</p>
</div>

<script>
// ===== 八卦（先天數 1–8）=====
// lines: 由下往上，1 = 陽，0 = 陰
const TRIGRAMS = {
  1: { name: '乾', image: '天', element: '金', lines: [1,1,1] },
  2: { name: '兌', image: '澤', element: '金', lines: [1,1,0] },
  3: { name: '離', image: '火', element: '火', lines: [1,0,1] },
  4: { name: '震', image: '雷', element: '木', lines: [1,0,0] },
  5: { name: '巽', image: '風', element: '木', lines: [0,1,1] },

// ===== 小型 Transformer 推論（純 JS、CPU）=====
// 檔案格式：4 位元組標頭長度 n、n 位元組 JSON 標頭、補齊到 4 的倍數、其後為 float16 權重。
function loadModel(buf) {
  const n = new DataView(buf).getUint32(0, true);
  const head = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 4, n)));
  const start = 4 + n + (4 - (4 + n) % 4) % 4;
  const half = new Uint16Array(buf, start, (buf.byteLength - start) / 2);

  const lut = new Float32Array(65536);
  for (let i = 0; i < 65536; i++) {
    const s = i & 0x8000 ? -1 : 1, e = (i >> 10) & 31, m = i & 1023;
    lut[i] = e === 0 ? s * 2 ** -14 * (m / 1024) : e === 31 ? (m ? NaN : s * Infinity) : s * 2 ** (e - 15) * (1 + m / 1024);
  }
  const W = {};
  for (const t of head.t) {
    const size = t.s.reduce((a, b) => a * b, 1);
    const w = new Float32Array(size);
    for (let i = 0; i < size; i++) w[i] = lut[half[t.o + i]];
    W[t.n] = w;
  }

  const { q1: D, q2: HEADS, q3: V, q4: LAYERS, q5: CTX } = head.c;
  const HD = D / HEADS;
  const vocab = head.v;
  const id = Object.fromEntries(vocab.map((ch, i) => [ch, i]));
  const START = id['\x02'], END = id['\x03'];

  const linear = (w, b, x, out, rows, cols) => {
    for (let r = 0; r < rows; r++) {
      let sum = b ? b[r] : 0;
      const base = r * cols;
      for (let c = 0; c < cols; c++) sum += w[base + c] * x[c];
      out[r] = sum;
    }
  };
  const layerNorm = (x, g, b, out) => {
    let mean = 0, v = 0;
    for (let i = 0; i < x.length; i++) mean += x[i];
    mean /= x.length;
    for (let i = 0; i < x.length; i++) v += (x[i] - mean) ** 2;
    const inv = 1 / Math.sqrt(v / x.length + 1e-5);
    for (let i = 0; i < x.length; i++) out[i] = (x[i] - mean) * inv * g[i] + b[i];
  };
  const gelu = x => 0.5 * x * (1 + Math.tanh(0.7978845608028654 * (x + 0.044715 * x * x * x)));

  // 貪婪解碼：把提示文字逐字送入，之後每步取機率最高的字，直到結束符或上限
  function generate(prompt) {
    const tokens = [START];
    for (const ch of prompt) {
      if (!(ch in id)) throw new Error(`詞表沒有「${ch}」`);
      tokens.push(id[ch]);
    }
    const promptLen = tokens.length;
    const kc = [], vc = [];
    for (let l = 0; l < LAYERS; l++) { kc.push(new Float32Array(CTX * D)); vc.push(new Float32Array(CTX * D)); }
    const x = new Float32Array(D), h = new Float32Array(D), qkv = new Float32Array(3 * D),
      att = new Float32Array(D), tmp = new Float32Array(D), ff = new Float32Array(4 * D),
      logits = new Float32Array(V), score = new Float32Array(CTX);
    let out = '';

    for (let pos = 0; pos < CTX; pos++) {
      for (let i = 0; i < D; i++) x[i] = W.a[tokens[pos] * D + i] + W.b[pos * D + i];
      for (let l = 0; l < LAYERS; l++) {
        const p = `z${l}.`;
        layerNorm(x, W[p + 'e'], W[p + 'f'], h);
        linear(W[p + 'g'], W[p + 'h'], h, qkv, 3 * D, D);
        kc[l].set(qkv.subarray(D, 2 * D), pos * D);
        vc[l].set(qkv.subarray(2 * D), pos * D);
        for (let hd = 0; hd < HEADS; hd++) {
          const o = hd * HD;
          let max = -Infinity;
          for (let t = 0; t <= pos; t++) {
            let s = 0;
            for (let i = 0; i < HD; i++) s += qkv[o + i] * kc[l][t * D + o + i];
            score[t] = s / Math.sqrt(HD);
            if (score[t] > max) max = score[t];
          }
          let sum = 0;
          for (let t = 0; t <= pos; t++) { score[t] = Math.exp(score[t] - max); sum += score[t]; }
          for (let i = 0; i < HD; i++) {
            let a = 0;
            for (let t = 0; t <= pos; t++) a += score[t] * vc[l][t * D + o + i];
            att[o + i] = a / sum;
          }
        }
        linear(W[p + 'i'], W[p + 'j'], att, tmp, D, D);
        for (let i = 0; i < D; i++) x[i] += tmp[i];
        layerNorm(x, W[p + 'k'], W[p + 'l'], h);
        linear(W[p + 'm'], W[p + 'n'], h, ff, 4 * D, D);
        for (let i = 0; i < 4 * D; i++) ff[i] = gelu(ff[i]);
        linear(W[p + 'o'], W[p + 'p'], ff, tmp, D, 4 * D);
        for (let i = 0; i < D; i++) x[i] += tmp[i];
      }
      if (pos < promptLen - 1) continue;           // 還在讀提示，不需要輸出
      layerNorm(x, W.c, W.d, h);
      linear(W.a, null, h, logits, V, D);          // 輸出層與字嵌入共用權重
      let best = 0;
      for (let i = 1; i < V; i++) if (logits[i] > logits[best]) best = i;
      if (best === END) break;
      out += vocab[best];
      tokens.push(best);
    }
    return out;
  }

  return {
    generate,
    template: head.p,
    info: { layers: LAYERS, dim: D, heads: HEADS, vocab: V, context: CTX, params: Object.values(W).reduce((s, w) => s + w.length, 0) }
  };
}

// 解析模型輸出的最後幾行：動爻、三卦序號、體用、各項生剋、月令、分數與吉凶
function parseReading(raw) {
  const lines = raw.trim().split('\n');
  const mv = /動\d+→(\d)/.exec(lines[2] || '');
  const gua = /本\D+?(\d+)互\D+?(\d+)變\D+?(\d+)/.exec(lines[3] || '');
  const tiyong = /體(.)(.)用(.)(.)/.exec(lines[4] || '');
  const final = /^(\d+)(\S+)$/.exec(lines[7] || '');
  if (!mv || !gua || !tiyong || !final) return null;
  return {
    moving: +mv[1], ben: +gua[1], hu: +gua[2], bian: +gua[3],
    ti: { tri: tiyong[1], el: tiyong[2] }, yong: { tri: tiyong[3], el: tiyong[4] },
    terms: [...(lines[5] || '').matchAll(/(用|互|變)(.):(\S+?)([+-]\d+)/g)].map(m => ({ tag: m[1], tri: m[2], rel: m[3], pts: +m[4] })),
    season: (/季(.)([+-]\d+)/.exec(lines[5] || '') || [])[1] || null,
    score: +final[1], level: final[2], raw
  };
}

const mod1 = (n, m) => (n % m) || m;
const triOf = l => Number(Object.keys(TRIGRAMS).find(k => TRIGRAMS[k].lines.join('') === l.join('')));
const hexOf = l => HEX_BY_TRIGRAMS[`${triOf(l.slice(3))}-${triOf(l.slice(0, 3))}`].num;
function ruleCast(yearNum, month, day, hourNum) {
  const upper = mod1(yearNum + month + day, 8), sum = yearNum + month + day + hourNum;
  const lower = mod1(sum, 8), moving = mod1(sum, 6);
  const lines = [...TRIGRAMS[lower].lines, ...TRIGRAMS[upper].lines];
  const changed = lines.slice(); changed[moving - 1] = 1 - changed[moving - 1];
  return { moving, ben: hexOf(lines), hu: hexOf([...lines.slice(1, 4), ...lines.slice(2, 5)]), bian: hexOf(changed) };
}

(function sky() {
  const canvas = $('sky'), ctx = canvas.getContext('2d');
  function draw() {
    const w = canvas.width = innerWidth * devicePixelRatio, h = canvas.height = innerHeight * devicePixelRatio;
    ctx.clearRect(0, 0, w, h);
    let seed = 7;
    const rnd = () => (seed = 16807 * seed % 2147483647) / 2147483647;
    for (let i = 0; i < 220; i++) {
      ctx.fillStyle = `rgba(236,228,210,${(0.55 * rnd() + 0.08).toFixed(2)})`;
      ctx.beginPath();
      ctx.arc(rnd() * w, rnd() * h, (1.1 * rnd() + 0.3) * devicePixelRatio, 0, 7);
      ctx.fill();
    }
  }
  draw();
  addEventListener('resize', draw);
})();

function getAudio() {
  if (!soundOn) return null;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') audio.resume();
    return audio;
  } catch (e) { return null; }
}
function bell(freq = 392, gain = 0.16, secs = 4) {
  if (skipping) return;
  const ac = getAudio(); if (!ac) return;
  const t = ac.currentTime, master = ac.createGain();
  master.gain.value = gain; master.connect(ac.destination);
  [[1, 1], [2.76, 0.45], [5.4, 0.22], [8.93, 0.1]].forEach(([ratio, amp]) => {
    const osc = ac.createOscillator(), env = ac.createGain();
    osc.type = 'sine'; osc.frequency.value = freq * ratio;
    env.gain.setValueAtTime(0, t);
    env.gain.linearRampToValueAtTime(amp, t + 0.008);
    env.gain.exponentialRampToValueAtTime(1e-4, t + secs / ratio ** 0.5);
    osc.connect(env); env.connect(master);
    osc.start(t); osc.stop(t + secs);
  });
}
function tick() {
  if (skipping) return;
  const ac = getAudio(); if (!ac) return;
  const t = ac.currentTime, osc = ac.createOscillator(), env = ac.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(900, t);
  osc.frequency.exponentialRampToValueAtTime(420, t + 0.08);
  env.gain.setValueAtTime(0.12, t);
  env.gain.exponentialRampToValueAtTime(1e-4, t + 0.12);
  osc.connect(env); env.connect(ac.destination);
  osc.start(t); osc.stop(t + 0.15);
}

function readInput() {
  const [date, time] = $('when').value.split('T');
  if (!date || !time) throw new Error('請擇定時辰。');
  const [y, m, d] = date.split('-').map(Number);
  const [h, mi] = time.split(':').map(Number);
  if (y < 1900 || y > 2100) throw new Error('此卦僅通一九〇〇至二一〇〇年間之時。');
  if (typeof Solar === 'undefined') throw new Error('農曆函式庫載入失敗，請檢查網路後重新整理。');
  const lunar = Solar.fromYmdHms(y, m, d, h, mi, 0).getLunar();
  const monthName = lunar.getMonthInChinese().replace('腊', '臘').replace('闰', '閏');
  const hourZhi = lunar.getTimeZhi();
  return {
    yearZhi: lunar.getYearZhi(), month: Math.abs(lunar.getMonth()), day: lunar.getDay(),
    hourZhi, monthZhi: lunar.getMonthZhi(),
    pillars: [lunar.getYearInGanZhi() + '年', monthName + '月', lunar.getDayInChinese(), hourZhi + '時'],
    text: `${lunar.getYearInGanZhi()}年　${monthName}月${lunar.getDayInChinese()}　${hourZhi}時`
  };
}

let model = null, running = false, skipping = false, timers = [];
const wait = ms => new Promise(resolve => {
  if (skipping) return resolve();
  const id = setTimeout(resolve, ms);
  timers.push(() => { clearTimeout(id); resolve(); });
});
function skipAnimation() {
  if (!running || skipping) return;
  skipping = true;
  timers.splice(0).forEach(cancel => cancel());
}

const spin = { angle: 0, speed: 0.02, target: 0.02, raf: 0 };
function spinStep() {
  spin.speed += 0.04 * (spin.target - spin.speed);
  spin.angle += spin.speed;
  const tri = $('vring').querySelector('.tri');
  if (tri) tri.setAttribute('transform', `rotate(${spin.angle.toFixed(2)})`);
  spin.raf = requestAnimationFrame(spinStep);
}

function finish() {
  const slip = $('slip');
  if (slip && skipping) {
    slip.classList.add('instant');
    slip.querySelectorAll('.yao').forEach(e => e.classList.add('drawn', 'lit'));
    slip.querySelectorAll('.gua').forEach(e => e.classList.add('named', 'shown'));
    slip.querySelectorAll('.step').forEach(e => e.classList.add('shown'));
    slip.querySelector('.verse').classList.add('inked');
    slip.querySelector('.seal').classList.add('down');
    slip.querySelectorAll('.verse span').forEach(e => { e.style.transitionDelay = '0ms'; });
  }
  $('veil').classList.remove('on', 'fade');
  cancelAnimationFrame(spin.raf);
  running = false; skipping = false;
  const go = $('go');
  go.disabled = false; go.textContent = '再卜';
}

async function cast() {
  if (running) return;
  if (!model) { $('oracle').innerHTML = '<p class="hush">模型尚在載入，請稍候。</p>'; return; }
  let input;
  try { input = readInput(); } catch (e) { $('oracle').innerHTML = `<p class="hush">${e.message}</p>`; return; }
  running = true; skipping = false; timers = [];
  const go = $('go'), veil = $('veil'), pillars = $('pillars'), whisper = $('whisper'), rm = reduceMotion.matches;
  go.disabled = true; go.textContent = '靜心';
  pillars.innerHTML = input.pillars.map(p => `<span class="pillar">${p}</span>`).join('');
  whisper.textContent = '凝神　默念所問';
  veil.classList.add('on'); veil.classList.remove('fade');
  if (!rm) { spin.speed = 0.02; spin.target = 0.25; cancelAnimationFrame(spin.raf); spin.raf = requestAnimationFrame(spinStep); }
  bell(330, 0.14, 5);
  await wait(60);

  // 推演在幕後進行：把五個輸入交給模型，解析它寫出的結果
  let reading = null, ms = 0;
  try {
    const prompt = model.template.replace('{0}', input.yearZhi).replace('{1}', input.month).replace('{2}', input.day)
      .replace('{3}', input.hourZhi).replace('{4}', input.monthZhi);
    const t0 = performance.now();
    reading = parseReading(model.generate(prompt));
    ms = performance.now() - t0;
  } catch (e) { reading = null; }

  await wait(rm ? 400 : 1100);
  whisper.textContent = '以時起卦';
  for (const p of pillars.children) { p.classList.add('shown'); tick(); await wait(rm ? 120 : 320); }
  if (!rm) spin.target = 3.2;
  await wait(rm ? 300 : 900);

  if (!reading) {
    veil.classList.remove('on'); cancelAnimationFrame(spin.raf);
    running = false; skipping = false; go.disabled = false; go.textContent = '起卦';
    $('oracle').innerHTML = '<p class="hush">天機混沌，請換一時辰再卜。</p>';
    return;
  }

  const check = ruleCast(ZHI.indexOf(input.yearZhi) + 1, input.month, input.day, ZHI.indexOf(input.hourZhi) + 1);
  $('oracle').innerHTML = slipHtml(reading, input, $('topic').value, check, ms);
  const slip = $('slip');
  if (skipping) return finish();

  whisper.textContent = '卦成';
  spin.target = 0.02;
  await wait(rm ? 200 : 500);
  veil.classList.add('fade');
  $('oracle').scrollIntoView({ behavior: rm ? 'auto' : 'smooth', block: 'start' });
  await wait(rm ? 100 : 600);
  veil.classList.remove('on', 'fade');
  cancelAnimationFrame(spin.raf);
  slip.querySelector('.slip-head').classList.add('shown');

  // 本卦一爻一爻畫出，動爻發亮
  const ben = slip.querySelector('.gua.ben');
  ben.classList.add('shown');
  for (const yao of ben.querySelectorAll('.yao')) { yao.classList.add('drawn'); tick(); await wait(rm ? 90 : 380); }
  await wait(rm ? 100 : 300);
  const moving = ben.querySelector('.yao.dong');
  if (moving) moving.classList.add('lit');
  bell(587, 0.07, 2.2);
  await wait(rm ? 150 : 700);
  ben.classList.add('named');
  await wait(rm ? 150 : 500);
  for (const cls of ['hu', 'bian']) {
    const gua = slip.querySelector('.gua.' + cls);
    gua.classList.add('shown');
    for (const yao of gua.querySelectorAll('.yao')) { yao.classList.add('drawn'); await wait(rm ? 30 : 70); }
    gua.classList.add('named');
    await wait(rm ? 100 : 300);
  }

  // 蓋印、定吉凶
  await wait(rm ? 100 : 400);
  slip.querySelector('.seal').classList.add('down');
  setTimeout(() => { if (!skipping && !rm) slip.classList.add('shake'); bell(262, 0.2, 6); }, rm ? 0 : 230);
  await wait(rm ? 200 : 700);
  slip.querySelector('.verdict').classList.add('shown');
  await wait(rm ? 150 : 600);

  // 卦辭逐字顯影，再逐段出現解讀
  const verse = slip.querySelector('.verse');
  [...verse.querySelectorAll('span:not(.vt)')].forEach((s, i) => { s.style.transitionDelay = (rm ? 0 : 60 * i) + 'ms'; });
  verse.classList.add('inked');
  await wait(rm ? 200 : 300 + 60 * verse.querySelectorAll('span').length);
  for (const p of slip.querySelectorAll('.reading .step')) { p.classList.add('shown'); await wait(rm ? 100 : 450); }
  finish();
}

// ===== 啟動 =====
$('veil').addEventListener('click', skipAnimation);
$('oracle').addEventListener('click', skipAnimation);
addEventListener('keydown', e => { if (e.key === 'Escape') skipAnimation(); });
$('when').addEventListener('input', () => { showLunar(); $('go').textContent = '起卦'; });
$('topic').addEventListener('change', () => { $('go').textContent = '起卦'; });
$('altar').addEventListener('submit', e => { e.preventDefault(); cast(); });

(function setNow() {
  const d = new Date();
  $('when').value = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
})();
showLunar();

$('go').disabled = true;
fetch('model.bin')
  .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.arrayBuffer(); })
  .then(buf => { model = loadModel(buf); $('go').disabled = false; })
  .catch(e => {
    $('oracle').innerHTML = `<p class="hush">模型載入失敗（${e.message}）。請由網站開啟，直接開檔案讀不到 model.bin。</p>`;
  });

</script>
</body>
</html>
